name: Build and Publish

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  JAVA_VERSION: "21.0.11"

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write

# Serialize runs on main so concurrent merges do not race to create the same release tag.
# Runs on other refs (PRs) cancel superseded in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Gradle build with unit tests
        # Use --write-locks to support dependency updates from Dependabot PRs
        run: ./gradlew build --write-locks --info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  next-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check-tip.outputs.is-tip }}
      version: ${{ steps.get-version.outputs.replaced }}
      tag: ${{ steps.get-tag.outputs.new_tag }}
    steps:
      # Checkout the repository including tags
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only release the commit that is currently the tip of main. A newer commit on main
      # will be released by its own run and includes the changes of this commit.
      - name: Check commit is tip of main
        id: check-tip
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "is-tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release: $GITHUB_SHA is no longer the tip of main ($MAIN_SHA)"
          fi
      # Determine the next semantic version based on the commit message tags
      - name: Get next tag
        id: get-tag
        if: steps.check-tip.outputs.is-tip == 'true'
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: false
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main
      - name: Get next version
        id: get-version
        if: steps.check-tip.outputs.is-tip == 'true'
        uses: frabert/replace-string-action@b6828c5a4cb6371753ff873b0d1c4c4fbd9a63cb # v2.5
        with:
          pattern: 'v(.*)'
          string: ${{ steps.get-tag.outputs.new_tag }}
          replace-with: '$1'
      - name: Print new tag and version
        if: steps.check-tip.outputs.is-tip == 'true'
        run: |
          echo "Next version: ${{ steps.get-version.outputs.replaced }}"
          echo "Next version tag: ${{ steps.get-tag.outputs.new_tag }}"

  publish:
    needs: [build, next-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && needs.next-version.outputs.release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Create a new release
        run: ./gradlew release

      - name: Publish to Sonatype Nexus OSS
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USER_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_USER_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PGP_PASSPHRASE }}
        run: ./gradlew publishToSonatype closeAndReleaseStagingRepository --no-daemon

  create-release:
     needs: [next-version, publish]
     if: github.ref == 'refs/heads/main' && needs.next-version.outputs.release == 'true'
     runs-on: ubuntu-latest
     env:
       NEXT_VERSION: ${{ needs.next-version.outputs.version }}
       NEXT_VERSION_TAG: ${{ needs.next-version.outputs.tag }}
     steps:
       - name: Checkout
         uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         with:
           fetch-depth: 0
       - name: Create or update GitHub release
         uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
         with:
           token: ${{ secrets.GITHUB_TOKEN }}
           tag: ${{ env.NEXT_VERSION_TAG }}
           name: ${{ env.APPLICATION_NAME }} ${{ env.NEXT_VERSION }}
           draft: false
           prerelease: false
           allowUpdates: true
           makeLatest: true
           generateReleaseNotes: true
